name: Red Packet Nobetci

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kodları tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_HEARTBEAT: ${{ vars.DAILY_HEARTBEAT }}
        run: python check_codes.py

      - name: Durum dosyalarını repoya kaydet
        run: |
          git config user.name "nobetci-bot"
          git config user.email "nobetci-bot@users.noreply.github.com"
          git add seen_codes.txt
          git add last_heartbeat.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "nöbetçi durumu güncellendi"
          git push
